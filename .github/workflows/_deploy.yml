name: Deploy to Cloud Run (reusable)

on:
    workflow_call:
        inputs:
            service:
                description: Cloud Run service name
                required: true
                type: string
            database_id:
                description: Firestore database ID
                required: true
                type: string
            profile:
                description: Spring profile
                required: true
                type: string
            environment:
                description: GitHub Environment name (protects secrets / approvals)
                required: true
                type: string
            image_tag:
                description: Extra image tag in addition to commit SHA (e.g. latest, dev)
                required: false
                type: string
                default: latest
        secrets:
            GCP_PROJECT_ID:
                required: true
            GCP_SA_KEY:
                required: true

env:
    REGION: asia-northeast3

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}

        permissions:
            contents: read
            id-token: write

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'
                    cache: gradle

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Build with Gradle
                run: ./gradlew clean build -x test

            -   name: Authenticate to Google Cloud
                uses: google-github-actions/auth@v2
                with:
                    credentials_json: ${{ secrets.GCP_SA_KEY }}

            -   name: Set up Cloud SDK
                uses: google-github-actions/setup-gcloud@v2

            -   name: Configure Docker for Artifact Registry
                run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

            -   name: Build & Push Docker image
                run: |
                    IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/draw-my-today/app
                    docker build -t $IMAGE:${{ github.sha }} \
                                 -t $IMAGE:${{ inputs.image_tag }} .
                    docker push $IMAGE:${{ github.sha }}
                    docker push $IMAGE:${{ inputs.image_tag }}

            -   name: Deploy to Cloud Run
                run: |
                    IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/draw-my-today/app

                    SECRETS="KAKAO_API_KEY=KAKAO_API_KEY:latest"
                    SECRETS="${SECRETS},KARLO_API_URL=KARLO_API_URL:latest"
                    SECRETS="${SECRETS},NEGATIVE_PROMPT=NEGATIVE_PROMPT:latest"
                    SECRETS="${SECRETS},KARLO_DEFAULT_STYLE=KARLO_DEFAULT_STYLE:latest"
                    SECRETS="${SECRETS},R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest"
                    SECRETS="${SECRETS},R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest"
                    SECRETS="${SECRETS},R2_BUCKET_NAME=R2_BUCKET_NAME:latest"
                    SECRETS="${SECRETS},R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest"
                    SECRETS="${SECRETS},R2_CUSTOM_DOMAIN=R2_CUSTOM_DOMAIN:latest"
                    SECRETS="${SECRETS},OPENAI_API_KEY=OPENAI_API_KEY:latest"
                    SECRETS="${SECRETS},DALLE_API_URL=DALLE_API_URL:latest"
                    SECRETS="${SECRETS},AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest"
                    SECRETS="${SECRETS},AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest"
                    SECRETS="${SECRETS},AWS_S3_BUCKET=AWS_S3_BUCKET:latest"
                    SECRETS="${SECRETS},GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest"
                    SECRETS="${SECRETS},GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest"
                    SECRETS="${SECRETS},GOOGLE_TOKEN_URL=GOOGLE_TOKEN_URL:latest"
                    SECRETS="${SECRETS},GOOGLE_USER_INFO_URL=GOOGLE_USER_INFO_URL:latest"
                    SECRETS="${SECRETS},GOOGLE_REDIRECT_URI=GOOGLE_REDIRECT_URI:latest"
                    SECRETS="${SECRETS},GOOGLE_DELETE_ACCOUNT_URL=GOOGLE_DELETE_ACCOUNT_URL:latest"
                    SECRETS="${SECRETS},APPLE_IOS_CLIENT_ID=APPLE_IOS_CLIENT_ID:latest"
                    SECRETS="${SECRETS},APPLE_IOS_TEAM_ID=APPLE_IOS_TEAM_ID:latest"
                    SECRETS="${SECRETS},APPLE_IOS_KEY_ID=APPLE_IOS_KEY_ID:latest"
                    SECRETS="${SECRETS},APPLE_IOS_PRIVATE_KEY=APPLE_IOS_PRIVATE_KEY:latest"
                    SECRETS="${SECRETS},APPLE_IOS_TOKEN_URL=APPLE_IOS_TOKEN_URL:latest"
                    SECRETS="${SECRETS},APPLE_IOS_DELETE_ACCOUNT_URL=APPLE_IOS_DELETE_ACCOUNT_URL:latest"
                    SECRETS="${SECRETS},JWT_SECRET=JWT_SECRET:latest"
                    SECRETS="${SECRETS},ENCRYPTOR_SECRET_KEY=ENCRYPTOR_SECRET_KEY:latest"
                    SECRETS="${SECRETS},PRESIGNED_IMAGE_EXPIRATION_ADMIN_DIARIES=PRESIGNED_IMAGE_EXPIRATION_ADMIN_DIARIES:latest"
                    SECRETS="${SECRETS},GPT_CHAT_COMPLETIONS_PROMPT=GPT_CHAT_COMPLETIONS_PROMPT:latest"
                    SECRETS="${SECRETS},GPT_CHAT_COMPLETIONS_REGENERATE_PROMPT=GPT_CHAT_COMPLETIONS_REGENERATE_PROMPT:latest"
                    SECRETS="${SECRETS},STABILITY_API_KEY=STABILITY_API_KEY:latest"

                    gcloud run deploy ${{ inputs.service }} \
                        --image $IMAGE:${{ github.sha }} \
                        --region ${{ env.REGION }} \
                        --platform managed \
                        --allow-unauthenticated \
                        --set-env-vars "PROFILE=${{ inputs.profile }},SERVER_PORT=8080,FIRESTORE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},FIRESTORE_DATABASE_ID=${{ inputs.database_id }}" \
                        --set-secrets "${SECRETS}" \
                        --memory 512Mi \
                        --cpu 1 \
                        --min-instances 0 \
                        --max-instances 3 \
                        --concurrency 20 \
                        --timeout 300 \
                        --cpu-boost \
                        --project ${{ secrets.GCP_PROJECT_ID }} \
                        --quiet
