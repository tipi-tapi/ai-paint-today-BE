name: Deploy Dev

on:
    push:
        branches: [ "develop" ]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    deploy:
        uses: ./.github/workflows/_deploy.yml
        with:
            service: draw-my-today-dev
            database_id: draw-my-today-db-dev
            profile: develop
            environment: dev
            image_tag: dev
        secrets: inherit
